<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformator pasporti</title>

<!-- предподключение — экономит время на установке соединений -->
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://api.qrserver.com">
<link rel="preconnect" href="https://drive.google.com">

<!-- Иконка приложения при «Добавить на главный экран» -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="icon" type="image/jpeg" href="icon.jpg">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#77634f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pasport">

<style>
  html,body{height:100%;margin:0;background:#d6ccbc}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:none}
  #ld{position:fixed;inset:0;z-index:10;background:#f5f0e6;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;transition:opacity .4s ease;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
  .spin{width:46px;height:46px;border-radius:50%;border:4px solid #e3d9c5;border-top-color:#77634f;
      animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .t{color:#77634f;font-size:14px;font-weight:700;letter-spacing:.4px}
  @media (prefers-color-scheme:dark){
    html,body{background:#15110d}
    #ld{background:#231e17}
    .spin{border-color:#3d352a;border-top-color:#c6a463}
    .t{color:#c6a463}
  }
</style>
</head>
<body>
  <div id="ld">
    <div class="spin"></div>
    <div class="t" id="ldt">Ma'lumotlar yuklanmoqda…</div>
  </div>
  <iframe id="app" allow="fullscreen; web-share; clipboard-write"></iframe>
  <script>
    // ⬇⬇⬇ ВСТАВЬ СЮДА свою /exec ссылку веб-приложения ⬇⬇⬇
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKI8ulC-lhXh1LKlo0DUKFa0tzdgJcU-OaoeMdE4c_A7cTvCF5O1VvBdzwd6o9JrCGMQ/exec';

    var f = document.getElementById('app');
    // передаём внутрь ?id=N и СВОЙ адрес (pub) — QR «Поделиться» строится от него сам
    var joiner = location.search ? location.search + '&' : '?';
    f.src = SCRIPT_URL + joiner + 'pub=' + encodeURIComponent(location.origin + location.pathname);
    // сменяющиеся статусы, пока грузится
    var steps = ['Serverga ulanmoqda…', 'Ma\'lumotlar tayyorlanmoqda…', 'Deyarli tayyor…'];
    var si = 0, stTimer = setInterval(function(){
      var t = document.getElementById('ldt');
      if (t && si < steps.length) t.textContent = steps[si++];
      else clearInterval(stTimer);
    }, 2200);

    function hide(){ clearInterval(stTimer);
      var l = document.getElementById('ld');
      if (l) { l.style.opacity = 0; setTimeout(function(){ l.remove(); }, 450); } }
    f.addEventListener('load', function(){ setTimeout(hide, 300); });
    setTimeout(hide, 12000);
  </script>
</body>
</html>
